[project]
name = "ets2-ad"
version = "2.0.0"
description = "External autonomous driving stack for Euro Truck Simulator 2"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "mss>=10.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "psutil>=5.9",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Perception runs its models with ONNX Runtime (ADR-0007). One of these two:
# the GPU build brings its own CUDA and cuDNN from pip, about 2.5 GB, and falls
# back to the CPU where there is no NVIDIA GPU.
perception = ["onnxruntime-gpu[cuda,cudnn]>=1.20"]
perception-cpu = ["onnxruntime>=1.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
# Both install the `onnxruntime` module; they cannot live side by side.
conflicts = [[{ extra = "perception" }, { extra = "perception-cpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "pal", "adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PTH",  # flake8-use-pathlib -- portability rule: no os.path string joins
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "game: requires a running Euro Truck Simulator 2 instance",
    "hardware: requires the real platform backend (uinput, X11, GPU)",
]
